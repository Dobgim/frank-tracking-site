<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrimeLogisticsFlow - Global Freight &amp; Cargo Solutions</title>
    <meta name="keywords" content="PrimeLogisticsFlow, prime logistics flow, freight forwarding, cargo tracking, global shipping" />
    <meta
      name="description"
      content="PrimeLogisticsFlow delivers world-class freight, cargo tracking and supply chain solutions with speed, precision and reliability."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Order matters: the original site loaded Bootstrap again after its header
      and page styles, so Bootstrap wins some ties. This order reproduces that.
    -->
    <link rel="stylesheet" href="/css/style.min.css" />
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="/css/toastr.min.css" />
    <link rel="stylesheet" href="/css/fonts.css" />
    <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/aos.css" />

    <!-- The original Contact and Track/Privacy/Terms pages never loaded Syne. -->
    <link rel="stylesheet" href="/css/fonts-syne.css" data-page-style="/ /services /about-us" media="not all" />

    <!-- Only the current route's sheet is enabled (see src/lib/pageStyles.js). -->
    <link rel="stylesheet" href="/css/page-home.css" data-page-style="/" media="not all" />
    <link rel="stylesheet" href="/css/page-services.css" data-page-style="/services" media="not all" />
    <link rel="stylesheet" href="/css/page-about.css" data-page-style="/about-us" media="not all" />
    <link rel="stylesheet" href="/css/page-contact.css" data-page-style="/contact" media="not all" />
    <script>
      document.querySelectorAll("link[data-page-style]").forEach(function (link) {
        if (link.dataset.pageStyle.split(" ").indexOf(location.pathname) !== -1) link.media = "all";
      });
    </script>

    <link rel="stylesheet" href="/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/footer.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
