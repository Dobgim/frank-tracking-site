<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061F33"/>
      <stop offset="60%" stop-color="#0A3D62"/>
      <stop offset="100%" stop-color="#0E4B75"/>
    </linearGradient>

    <!-- Teal Flow Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CF5D2"/>
      <stop offset="100%" stop-color="#1ABC9C"/>
    </linearGradient>

    <!-- Amber Flow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>

    <!-- Cube Gradients -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Rounded Badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" filter="url(#dropShadow)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Orbital Flow Ribbon 1 (Teal) -->
  <path d="M 22 74 C 22 46, 50 24, 82 24 C 98 24, 104 34, 98 44 C 92 54, 76 56, 64 62" 
        stroke="url(#tealGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- Orbital Flow Ribbon 2 (Amber) -->
  <path d="M 98 46 C 98 74, 70 96, 38 96 C 22 96, 16 86, 22 76 C 28 66, 44 64, 56 58" 
        stroke="url(#amberGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95"/>

  <!-- Flow Direction Arrows -->
  <path d="M 88 20 L 102 24 L 94 36 Z" fill="url(#tealGrad)"/>
  <path d="M 32 100 L 18 96 L 26 84 Z" fill="url(#amberGrad)"/>

  <!-- Central Isometric Cargo Cube -->
  <g transform="translate(60, 60)" filter="url(#dropShadow)">
    <!-- Top Face -->
    <polygon points="0,-22 20,-11 0,0 -20,-11" fill="url(#topFace)"/>
    <!-- Left Face -->
    <polygon points="-20,-11 0,0 0,22 -20,11" fill="url(#leftFace)"/>
    <!-- Right Face -->
    <polygon points="0,0 20,-11 20,11 0,22" fill="url(#rightFace)"/>
    <!-- Cargo Box Seams -->
    <path d="M 0,0 L 0,22 M -20,-11 L 0,0 L 20,-11" stroke="#061F33" stroke-width="1.2" opacity="0.4"/>
    <!-- Prime Speed Accent on Top -->
    <path d="M -8,-10 L 0,-6 L 8,-10" stroke="url(#tealGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="0" cy="0" r="2.5" fill="#F39C12"/>
  </g>

  <!-- Speed Dash Elements -->
  <circle cx="34" cy="40" r="2" fill="url(#tealGrad)" opacity="0.8"/>
  <circle cx="86" cy="80" r="2" fill="url(#amberGrad)" opacity="0.8"/>
</svg>
