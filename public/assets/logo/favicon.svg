<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061F33"/>
      <stop offset="100%" stop-color="#0A3D62"/>
    </linearGradient>
    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CF5D2"/>
      <stop offset="100%" stop-color="#1ABC9C"/>
    </linearGradient>
    <linearGradient id="favAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>

  <!-- Orbital Flow Ribbon (Teal) -->
  <path d="M 12 40 C 12 24, 28 12, 46 12 C 55 12, 58 18, 54 24" 
        stroke="url(#favTeal)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Orbital Flow Ribbon (Amber) -->
  <path d="M 52 24 C 52 40, 36 52, 18 52 C 9 52, 6 46, 10 40" 
        stroke="url(#favAmber)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Isometric Prime Cube -->
  <g transform="translate(32, 32)">
    <polygon points="0,-12 11,-6 0,0 -11,-6" fill="#FFFFFF"/>
    <polygon points="-11,-6 0,0 0,12 -11,6" fill="#94A3B8"/>
    <polygon points="0,0 11,-6 11,6 0,12" fill="#64748B"/>
    <circle cx="0" cy="0" r="2" fill="#F39C12"/>
  </g>
</svg>
